name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: windows-2022
            target: i686-pc-windows-msvc
          - arch: x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
          - arch: arm64
            # Native ARM64 packaging avoids unsupported cross-compilation.
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm build:packages

      - name: Build Windows installer
        # WiX MSI rejects semantic prerelease identifiers such as "beta.3".
        # Public Beta releases therefore use the native NSIS installer.
        run: pnpm --filter @harnesshub/desktop exec tauri build --bundles nsis --target ${{ matrix.target }}

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: HarnessHub-${{ matrix.target }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            # Native ARM64 runner produces an ARM64 Linux bundle directly.
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux bundle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm build:packages

      - name: Build Linux packages
        run: pnpm --filter @harnesshub/desktop exec tauri build --target ${{ matrix.target }}

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: HarnessHub-${{ matrix.target }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

  macos:
    name: macOS Apple Silicon
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm build:packages

      - name: Build macOS DMG
        run: pnpm --filter @harnesshub/desktop exec tauri build

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: HarnessHub-aarch64-apple-darwin
          if-no-files-found: error
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download all platform bundles
        uses: actions/download-artifact@v4
        with:
          pattern: HarnessHub-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release and upload bundles
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: release-assets/**/*
