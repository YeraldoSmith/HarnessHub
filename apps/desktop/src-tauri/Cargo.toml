[package]
name = "harnesshub-desktop"
version = "0.1.0"
description = "HarnessHub read-only desktop registry"
authors = ["YeraldoSmith"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "harnesshub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
wait-timeout = "0.2"
