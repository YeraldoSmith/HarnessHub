services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: harnesshub
      POSTGRES_USER: harnesshub
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harnesshub -d harnesshub"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - harnesshub-postgres:/var/lib/postgresql/data

volumes:
  harnesshub-postgres:
